<!DOCTYPE html>
<html>
<head>
    <title>Document Authoring Preview Mock</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styles/styles.css">
    <link rel="stylesheet" href="/blocks/quote/quote.css">
    <link rel="stylesheet" href="/blocks/tabs/tabs.css">
    
    <script type="module">
        import decorateQuote from '/blocks/quote/quote.js';
        import decorateTabs from '/blocks/tabs/tabs.js';

        window.addEventListener('DOMContentLoaded', () => {
            const quoteBlock = document.querySelector('.quote');
            if (quoteBlock) decorateQuote(quoteBlock);

            const tabsBlock = document.querySelector('.tabs');
            if (tabsBlock) decorateTabs(tabsBlock);
        });
    </script>
</head>
<body>
    <main>
        <div>
            <h1 style="font-family: Arial, sans-serif; margin-bottom: 20px;">Welcome to My Eds Site</h1>
            
            <div class="quote">
                <div>
                    <div>This page is for Showing the demo.</div>
                </div>
                <div>
                    <div>Manish</div>
                </div>
            </div>

            <br><br>

            <div class="tabs">
                <div>
                    <div>Overview</div>
                    <div>Content for the overview tab.</div>
                </div>
                <div>
                    <div>Pricing</div>
                    <div>Content for the pricing tab.</div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
